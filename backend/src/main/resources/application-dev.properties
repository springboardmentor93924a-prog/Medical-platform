# Development Profile - MySQL / MariaDB (XAMPP Compatible)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medistock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.medistock=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
