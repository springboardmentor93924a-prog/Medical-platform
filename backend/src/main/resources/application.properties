# Application Core Settings
spring.application.name=medistock-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
server.servlet.context-path=/

# Jackson Serialization
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Multipart File Upload (for backups / imports)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Settings
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Admin Bootstrap / Setup Key
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@medistock.com}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@MediStock2026!}
app.admin.bootstrap.name=${ADMIN_BOOTSTRAP_NAME:System Administrator}
app.admin.setup-key=${ADMIN_SETUP_KEY:MediStockAdminSecretSetupKey2026!}

# User Registration Approval Settings
app.registration.pharmacist-requires-approval=${PHARMACIST_APPROVAL_REQUIRED:false}
app.registration.staff-requires-approval=${STAFF_APPROVAL_REQUIRED:false}
app.registration.supplier-requires-approval=${SUPPLIER_APPROVAL_REQUIRED:false}

# Inventory Expiry Warning Days
app.inventory.expiry-warning-days=${EXPIRY_WARNING_DAYS:60}

# Automatic Scheduled Expiry Audit & In-App Alerts
app.notifications.expiry-days-threshold=${EXPIRY_DAYS_THRESHOLD:30}
app.scheduler.expiry-cron=${EXPIRY_AUDIT_CRON:0 0 1 * * ?}

# Database Backup & Recovery Configuration
app.backup.enabled=${BACKUP_SCHEDULE_ENABLED:true}
app.backup.cron=${BACKUP_SCHEDULE_CRON:0 0 2 * * ?}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Google OAuth2 Credentials (Optional/Configurable)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:medistock-oauth2-client-placeholder.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:medistock-oauth2-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
