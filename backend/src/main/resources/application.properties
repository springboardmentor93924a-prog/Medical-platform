
spring.application.name=medistock

# MariaDB database connection
spring.datasource.url=jdbc:mariadb://localhost:3307/medistock
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Keep your existing database tables unchanged
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Backend server
server.port=8080

# Security & JWT Token Configuration
medistock.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
medistock.jwt.expiration-ms=86400000

# HikariCP Connection Pool Settings (Optimized for MariaDB port 3307)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Local AI LLM Provider Configuration (Ollama)
medistock.ai.local.base-url=http://localhost:11434
medistock.ai.local.model=llama3.2:latest

# Multipart Upload Configuration for Voice Audio Recordings
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# MediStock Voice Engine Configuration
medistock.ai.voice.stt-provider=auto
medistock.ai.voice.tts-provider=auto
medistock.ai.voice.whisper-model=whisper-1
medistock.ai.voice.max-audio-seconds=120

# ============================================================================
# MediStock SMTP Email Notification Configuration (Brevo SMTP Relay)
# ============================================================================
spring.mail.host=${BREVO_SMTP_HOST:${MAIL_HOST:smtp-relay.brevo.com}}
spring.mail.port=${BREVO_SMTP_PORT:${MAIL_PORT:587}}
spring.mail.username=${BREVO_SMTP_USERNAME:${MEDISTOCK_GMAIL_USERNAME:${MAIL_USERNAME:}}}
spring.mail.password=${BREVO_SMTP_KEY:${MEDISTOCK_GMAIL_APP_PASSWORD:${MAIL_PASSWORD:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# MediStock Brand & Operational Email Configuration
medistock.mail.from=${MEDISTOCK_GMAIL_USERNAME:${MAIL_FROM:noreply@medistock.org}}
medistock.mail.from-name=${MAIL_FROM_NAME:MediStock Security & Verification}
medistock.mail.enabled=true
medistock.mail.mock-mode=${MAIL_MOCK_MODE:auto}
medistock.mail.app-url=${APP_URL:http://localhost:5173}

# ============================================================================
# MediStock MSG91 Real SMS Gateway Configuration
# ============================================================================
medistock.msg91.auth-key=${MSG91_AUTH_KEY:}
medistock.msg91.template-id=${MSG91_OTP_TEMPLATE_ID:}
medistock.msg91.base-url=${MSG91_BASE_URL:https://control.msg91.com}
medistock.msg91.enabled=true





