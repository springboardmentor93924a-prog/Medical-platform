
spring.application.name=MediStock
server.port=${PORT:8080}

spring.config.import=optional:file:./.env[.properties]

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medistock_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=-1

# Error Handling
server.error.include-message=always

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}


logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG