spring.application.name=medistock-backend
# Secrets live in application-local.properties (git-ignored). Each developer creates their own.
spring.profiles.default=local

spring.datasource.url=jdbc:mysql://localhost:3306/medistock?serverTimezone=UTC
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.expiry-minutes=60
app.cors.allowed-origins=http://localhost:5173
app.frontend-url=http://localhost:5173
app.mail.enabled=false
app.mail.from=no-reply@medistock.local
