spring.application.name=medistock-backend
server.port=8080

# The real password lives in application-local.properties (never committed to Git)
spring.profiles.active=local

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/medistock_db
spring.datasource.username=postgres

# Entities are checked against the existing tables, never created or changed
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Show SQL in the console while developing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true