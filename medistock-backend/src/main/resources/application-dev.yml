spring:
  datasource:
    url: jdbc:mysql://localhost:3306/medistock_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

  mail:
    host: smtp.gmail.com
    port: 587
    username: jobconnectteam31@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
    issuer: medistock

  email:
    enabled: true
    from-address: jobconnectteam31@gmail.com
    from-name: MediStock Notifications
    admin-email: sanchitnimse145@gmail.com

logging:
  level:
    org.springframework.security: INFO
    com.medistock: DEBUG
    org.springframework.mail: DEBUG
    com.sun.mail: DEBUG

backup:
    directory: ./backups
    max-backups: 10